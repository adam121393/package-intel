name = "marketagent"
main = "src/proxy-worker.ts"
compatibility_date = "2026-01-01"

# This Worker is a transparent reverse proxy, NOT the x402 service.
#
# The service runs on Node (behind a Cloudflare Tunnel) because Base mainnet
# does not work on the Workers runtime — verified: Workers+mainnet hangs 40s,
# Node+mainnet answers in 0.09s. Workers also cannot run the Bazaar discovery
# extension, whose Ajv validator compiles schemas with `new Function`.
#
# The Worker exists purely to give a stable public hostname in front of a quick
# tunnel, whose hostname changes on every restart.
[vars]
ORIGIN = "https://paste-full-harper-stack.trycloudflare.com"

[observability]
enabled = true

# Call log. Every request that reaches the Worker is recorded here — free ones
# served at the edge and paid ones on their way to the origin — so usage is
# visible in one place rather than split between two runtimes.
[[d1_databases]]
binding = "DB"
database_name = "package-intel-logs"
database_id = "25e583ee-2285-4c8f-a1c8-c611025184c2"

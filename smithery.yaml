# Smithery deployment config.
#
# Starts the server from the published npm package rather than building this
# repository. The repo root is the x402 API service and the MCP server lives in
# mcp-client/, so a root build would produce the wrong artifact — the same trap
# the checked-in Dockerfile exists to avoid. `npx -y package-intel-mcp` is also
# exactly the command the README and every other listing give, so there is one
# install path to keep working instead of two.
startCommand:
  type: stdio
  configSchema:
    type: object
    description: >-
      Everything is optional. With no configuration the four free tools
      (package_snapshot, package_vulns, package_deps, package_downloads) work
      immediately against npm, PyPI and crates.io.
    properties:
      x402PrivateKey:
        type: string
        title: Wallet private key (optional)
        description: >-
          Private key of a wallet funded with USDC on Base. Unlocks the paid
          tools package_health ($0.01/call) and package_batch_health
          ($0.02/call). This is a hot key that spends automatically — use a
          dedicated low-balance wallet, never your main one. Leave empty to
          stay on the free tools.
      apiUrl:
        type: string
        title: API base URL (optional)
        description: Override the backing API. Defaults to the hosted service.
        default: https://marketagent.adam121393.workers.dev
      network:
        type: string
        title: Payment network (optional)
        description: CAIP-2 network id for payments. eip155:8453 is Base mainnet.
        default: eip155:8453
    required: []
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'package-intel-mcp'],
      env: Object.assign(
        {},
        config.apiUrl ? { API_URL: config.apiUrl } : {},
        config.network ? { NETWORK: config.network } : {},
        // Only set when supplied: an empty string would look like a configured
        // wallet to the server and fail on an unparseable key rather than
        // falling back to free mode.
        config.x402PrivateKey ? { X402_PRIVATE_KEY: config.x402PrivateKey } : {}
      )
    })
  exampleConfig: {}
